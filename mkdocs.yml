site_name: Toolane 源码学习手册
site_description: 从入口、调度器、工作流到持久化与沙箱，系统学习 Toolane 的设计与实现。
site_url: https://haonox.github.io/toolane/
repo_name: haonox/toolane
repo_url: https://github.com/haonox/toolane
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Toolane contributors

theme:
  name: material
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 阅读指南:
      - 学习路线: guide/reading-path.md
      - 整体架构: guide/architecture.md
  - 最小执行链:
      - main.go 与 Demo: execution/main-demo.md
      - 工具契约与策略: execution/tool-contract.md
      - Manager.Submit: execution/submit.md
      - Worker 生命周期: execution/worker.md
      - 多租户调度器: execution/scheduler.md
  - 工作流:
      - DAG 调度: workflow/dag.md
  - 执行后端:
      - Process Executor: executors/process.md
  - 后续章节: roadmap.md
